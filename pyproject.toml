[project]
name = "agent-factory"
version = "0.1.0"
description = "Governed pipeline for running parallel Claude Code agents over a task backlog: git-worktree isolation, verification gates, sequential merge queue."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gaël Gaussens" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
factory = "factory.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
