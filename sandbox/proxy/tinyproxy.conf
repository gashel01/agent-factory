Port 8888
Listen 0.0.0.0
Timeout 600
# Deny every host except those matching the filter allow-list.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off
# Allow HTTPS CONNECT tunneling to standard TLS ports (end-to-end, no MITM).
ConnectPort 443
ConnectPort 563
# Client ACL: the agent container on the internal network may use the proxy.
Allow 0.0.0.0/0
