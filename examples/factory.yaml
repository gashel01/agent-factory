# agent-factory configuration — everything here is optional; defaults are sane.

repo_defaults:
  base_branch: main

concurrency:
  # User parameter, no hard ceiling in the code.
  # 2 is a conservative default on a Claude subscription plan: every agent shares
  # ONE plan rate-limit bucket with your own interactive Claude Code, so extra
  # concurrency competes with it. On API, or when you're not working alongside a
  # run, raise it freely — the rate-limit handler is the safety net, not this number.
  # Per-run override: `factory run --slots N`
  max_slots: 2
  stagger_seconds: 20
  # Best-of-N: independent agents per ticket on its first attempt (each takes a
  # slot); the verified candidate with the smallest diff wins. 1 = off.
  candidates: 1
  # Tickets depending on a BLOCKED one wait this long for your answer.
  blocked_wait_min: 60

agent:
  command: claude          # any CLI honoring the same flags works (tests use a stub)
  model: null              # null = the CLI's default; "haiku"/"sonnet" for mechanical tasks
  permission_mode: acceptEdits
  # Headless agents cannot answer permission prompts: anything not listed is denied.
  allowed_tools:
    - "Bash(git add:*)"
    - "Bash(git commit:*)"
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git log:*)"
    - "Bash(pytest:*)"
    - "Bash(python:*)"
    - "Bash(ruff:*)"

setup:
  commands: []             # run in each fresh worktree BEFORE the agent starts.
                           # Worktrees share no venv/node_modules with the main
                           # checkout — real repos need e.g.:
                           #   - "uv sync"        (Python)
                           #   - "npm ci"         (Node)
  timeout_s: 600

verify:
  commands: []             # default gate; tickets usually declare their own
  command_timeout_s: 600
  require_commands: true   # no command at all = not DONE (a diff proves nothing works);
                           # a single ticket can opt out with `skip_verify: true`
  # protected: [...]       # test/CI config the agent may not touch unless its ticket's
                           # files_hint names it; defaults cover conftest/pytest/jest/
                           # vitest config and .github/**. [] disables the check.

review:
  enabled: false           # adversarial second agent judging each diff before merge.
                           # Off by default (doubles per-task spend); turn on when
                           # merges land somewhere that matters.
  model: null              # cheap tier recommended, e.g. "haiku"
  timeout_min: 10
  attempts: 2              # a review with no verdict is retried this many times, then:
  on_failure: hold         # hold (you approve) | reject (back to the agent) | approve

supervisor:
  # The dashboard chat agent. It always reads the workspace ground truth;
  # extend its reach here — e.g. WebSearch, or MCP tools from a .mcp.json
  # placed in this workspace folder ("mcp__github__*", "mcp__linear__*").
  allowed_tools: ["Read", "Glob", "Grep", "Write", "Edit"]
  # A live run snapshot is fed to the supervisor on every message, so a cheap tier
  # answers fast and doesn't draw the run's coding-model quota. Default: "haiku".
  # null → same cheap default; "" → same model as the coding agents; or pin an id.
  model: haiku
  timeout_min: 10

ratelimit:
  cooldown_min: 20         # doubles on each subsequent pause: 20 → 40 → 80 ...
  max_pauses_before_stop: 6
  max_wait_min: 330        # wait for an announced reset up to this; further = stop cleanly

# contract_path: ./CONTRACT.md   # override the built-in execution contract
