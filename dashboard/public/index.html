<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-factory</title>
<style>
  /* Tokens: light first, dark via prefers-color-scheme. Status colors are the
     reserved status palette; every status signal pairs icon + label so color
     never carries meaning alone. */
  :root {
    --surface: #fcfcfb;
    --plane: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --active: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --plane: #0d0d0d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --active: #3987e5;
      --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app { max-width: 980px; margin: 0 auto; padding: 0 16px 56px; }
  h2 {
    font-size: 12.5px; margin: 0 0 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 650;
  }

  /* ------- sticky top bar: the one-glance answer ------- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--plane); padding: 16px 0 10px;
  }
  .headline { font-size: 20px; font-weight: 700; }
  .tone-good .headline { color: var(--good-text); }
  .tone-warning .headline { color: var(--ink); }
  .tone-critical .headline { color: var(--critical); }
  .subline { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .topbar-controls { display: flex; gap: 8px; flex-shrink: 0; }

  .progress {
    display: flex; height: 8px; border-radius: 999px; overflow: hidden;
    background: var(--hairline); margin: 2px 0 24px;
  }
  .progress-seg { height: 100%; }
  .progress-seg + .progress-seg { margin-left: 2px; } /* 2px surface gap between fills */
  .progress-seg.done { background: var(--good); }
  .progress-seg.failed { background: var(--critical); }
  .progress-seg.active { background: var(--active); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }

  .ws-picker {
    font: 600 13px/1 system-ui, sans-serif; color: var(--ink);
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 7px 10px; cursor: pointer; max-width: 180px;
  }
  .ws-picker:hover { border-color: var(--muted); }

  /* ------- buttons ------- */
  .btn {
    font: 600 13px/1 system-ui, sans-serif; cursor: pointer; border-radius: 8px;
    padding: 8px 14px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink);
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--active); border-color: var(--active); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--ink-2); }
  .btn.link {
    background: none; border: none; color: var(--active); padding: 4px 6px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .btn.danger-soft { color: var(--critical); border-color: var(--hairline); background: transparent; }
  .btn.danger-soft.armed { background: var(--critical); border-color: var(--critical); color: #fff; }
  .btn.close { font-size: 15px; padding: 4px 10px; }

  /* ------- zones ------- */
  .zone { margin-bottom: 26px; }
  .zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .zone.attention .card { border-left: 3px solid var(--warning); }
  .zone.attention .card.state-failed { border-left-color: var(--critical); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-activity { font-size: 13px; font-weight: 650; color: var(--ink-2); }
  .state-running .card-activity, .state-verifying .card-activity,
  .state-merging .card-activity, .state-merge_queued .card-activity { color: var(--active); }
  .state-failed .card-activity { color: var(--critical); }
  .state-blocked .card-activity { color: var(--ink); }
  .card-timer { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .card-title { font-weight: 650; font-size: 15px; }
  .card-note {
    color: var(--ink-2); font-size: 13px;
    border-left: 2px solid var(--hairline); padding-left: 9px;
  }
  .card-note.loud { color: var(--ink); background: color-mix(in srgb, var(--warning) 9%, transparent);
    border-left-color: var(--warning); padding: 7px 9px; border-radius: 0 6px 6px 0; }
  .card-facts { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .card-actions { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }

  /* waiting chips */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .queue-chip {
    font-size: 13px; color: var(--ink-2); background: var(--surface);
    border: 1px dashed var(--hairline); border-radius: 999px; padding: 5px 12px;
  }

  /* merged list */
  .done-list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .done-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 14px;
  }
  .done-row + .done-row { border-top: 1px solid var(--hairline); }
  .done-check { color: var(--good-text); font-weight: 700; }
  .done-title { font-weight: 550; flex: 1; }
  .done-meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* technical timeline */
  .timeline { margin-top: 8px; }
  .timeline summary {
    cursor: pointer; color: var(--muted); font-size: 13px; user-select: none;
  }
  .feed-list {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 0; max-height: 380px; overflow-y: auto; margin-top: 10px;
  }
  .feed-line {
    display: flex; gap: 12px; padding: 3px 14px;
    font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  .feed-ts { color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .feed-body { color: var(--ink-2); overflow-wrap: anywhere; }

  /* log overlay: the agent's story */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20;
  }
  .log-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    max-width: 780px; width: 100%; max-height: 82vh; display: flex; flex-direction: column;
    padding: 16px 20px;
  }
  .log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .log-head h3 { margin: 0; font-size: 15px; }
  .log-body { overflow-y: auto; }
  .story-say { color: var(--ink); font-size: 14px; margin: 10px 0; }
  .story-final { color: var(--ink); font-size: 14px; margin: 12px 0 4px; padding-top: 10px;
    border-top: 1px solid var(--hairline); }
  .story-act {
    font: 12.5px/1.6 ui-monospace, Consolas, monospace; color: var(--ink-2);
    padding: 1px 0 1px 10px; border-left: 2px solid var(--hairline);
  }
  .log-foot { margin-top: 10px; }
  .log-pre {
    margin: 0; font: 11.5px/1.5 ui-monospace, Consolas, monospace;
    color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* new-work panel */
  .work-panel { max-width: 680px; }
  .work-form { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .work-label { font-size: 12.5px; color: var(--muted); font-weight: 650; margin-top: 6px; }
  .work-label.inline { margin: 0; }
  .work-input {
    font: 14px/1.4 system-ui, sans-serif; color: var(--ink);
    background: var(--plane); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 11px;
  }
  .work-input:focus { outline: none; border-color: var(--active); }
  .work-goal { min-height: 64px; resize: vertical; }
  .work-input.slots { width: 70px; }
  .plan-out { max-height: 180px; overflow-y: auto; background: var(--plane);
    border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .repo-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .work-backlog { margin: 10px 0 16px; }
  .ticket-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--plane); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 12px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .ticket-title { font-weight: 600; font-size: 13.5px; }
  .ticket-file { color: var(--muted); font-weight: 400; font-size: 12px; }
  .ticket-editor { width: 100%; min-height: 260px; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .work-launch { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--hairline); padding-top: 14px; }

  /* supervisor chat */
  .chat-panel { max-width: 640px; height: 78vh; }
  .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    gap: 10px; padding: 6px 2px; }
  .chat-hint { color: var(--muted); font-size: 13px; margin: auto 12px; text-align: center; }
  .chat-msg {
    max-width: 85%; padding: 9px 13px; border-radius: 12px; font-size: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .chat-msg.you { align-self: flex-end; background: var(--active); color: #fff;
    border-bottom-right-radius: 4px; }
  .chat-msg.supervisor { align-self: flex-start; background: var(--plane);
    border: 1px solid var(--hairline); border-bottom-left-radius: 4px; }
  .chat-msg.thinking { color: var(--muted); }
  .chat-input-row { display: flex; gap: 8px; margin-top: 10px; }
  .chat-input { flex: 1; min-height: 44px; max-height: 120px; resize: vertical; }

  /* toasts */
  #toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column;
    gap: 8px; z-index: 30; }
  .toast {
    background: var(--ink); color: var(--plane); font-size: 13.5px; font-weight: 550;
    border-radius: 10px; padding: 10px 16px; max-width: 340px;
    animation: rise 0.18s ease-out;
  }
  .toast.error { background: var(--critical); color: #fff; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toasts"></div>
  <script src="/client.js" defer></script>
</body>
</html>
